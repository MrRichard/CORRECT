[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "correct"
version = "0.1.0"
description = "CORRECT DICOM RT Structure Processor"
requires-python = ">=3.11"
dependencies = [
    "pydicom",
    "pynetdicom",
    "rt-utils",
    "highdicom",
    "numpy",
    "watchdog",
    "PyYAML",
]

[project.scripts]
correct = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["netrt_core*"]

[tool.setuptools]
py-modules = ["main"]