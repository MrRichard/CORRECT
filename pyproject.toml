[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "correct"
version = "0.1.0"
description = "CORRECT DICOM RT Structure Processor"
requires-python = ">=3.11"
dependencies = [
    "pydicom",
    "pynetdicom",
    "rt-utils",
    "highdicom",
    "numpy",
    "watchdog",
    "PyYAML",
    "ruamel.yaml",
    "pywin32; sys_platform == 'win32'",
]

[project.scripts]
correct = "main:main"

[project.gui-scripts]
# Graphical configuration editor (runs without a console window on Windows).
correct-config = "correct_admin.config_ui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["netrt_core*", "correct_admin*"]

[tool.setuptools]
py-modules = ["main", "DicomAnonymizer"]